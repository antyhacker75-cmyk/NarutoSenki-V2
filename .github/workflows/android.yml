name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -perm -111 2>/dev/null | head -1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found in Android SDK"
            find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -maxdepth 4 -type f 2>/dev/null | grep -E '/sdkmanager$|/cmdline-tools/' | head -50 || true
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          SDK_ROOT="$(cd "$SDKMANAGER_DIR/../../.." && pwd)"

          echo "Found sdkmanager: $SDKMANAGER"
          echo "Android SDK root: $SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Verify Android SDK tools
        run: |
          which sdkmanager
          sdkmanager --version
          java -version

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK and NDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "ndk;18.1.5063045"

      - name: Set up Java 8 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Build debug APK
        working-directory: projects/NarutoSenki/proj.android-studio
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NarutoSenki-V2-debug-apk
          path: projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
