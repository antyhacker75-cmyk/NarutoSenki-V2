name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # setup-android v3 requires JDK 17+ for its sdkmanager.
      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;31.0.0" \
            "ndk;18.1.5063045"

      # The project uses Gradle 5.6.4 / Android Gradle Plugin 3.3.3,
      # so switch back to Java 8 for the actual Gradle build.
      - name: Set up Java 8 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Build debug APK
        working-directory: projects/NarutoSenki/proj.android-studio
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NarutoSenki-V2-debug-apk
          path: projects/NarutoSenki/proj.android-studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
